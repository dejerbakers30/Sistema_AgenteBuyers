<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INBESTIGA · Dashboard BI en React (Fase BUYER)</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React 18 & ReactDOM 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone para JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js para visualizaciones -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
        }
        .pulse-dot {
            animation: pulseAnimation 2s infinite;
        }
        @keyframes pulseAnimation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ══════════════════════════════════════════════════════════════════════
        // COMPONENTE PRINCIPAL (App)
        // ══════════════════════════════════════════════════════════════════════
        function App() {
            const [activeTab, setActiveTab] = useState('resumen'); // 'resumen' | 'trazabilidad' | 'chats'
            const [kpis, setKpis] = useState(null);
            const [buyers, setBuyers] = useState([]);
            const [conversaciones, setConversaciones] = useState([]);
            const [loading, setLoading] = useState(true);
            const [autoRefresh, setAutoRefresh] = useState(true);
            const [lastUpdated, setLastUpdated] = useState('');
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('ALL');
            const [selectedPhone, setSelectedPhone] = useState(null);

            // Cargar datos desde la API REST
            const fetchData = async (showSpinner = false) => {
                if (showSpinner) setIsRefreshing(true);
                try {
                    const [kpiRes, buyersRes, convRes] = await Promise.all([
                        fetch('/api/kpis').then(r => r.json()),
                        fetch('/api/buyers').then(r => r.json()),
                        fetch('/api/conversaciones').then(r => r.json())
                    ]);

                    setKpis(kpiRes);
                    setBuyers(buyersRes || []);
                    setConversaciones(convRes || []);
                    setLastUpdated(new Date().toLocaleTimeString());
                } catch (err) {
                    console.error('Error al consultar la API:', err);
                } finally {
                    setLoading(false);
                    if (showSpinner) setTimeout(() => setIsRefreshing(false), 500);
                }
            };

            // Efecto inicial y auto-refresco cada 3 segundos
            useEffect(() => {
                fetchData(false);
                let interval = null;
                if (autoRefresh) {
                    interval = setInterval(() => {
                        fetchData(false);
                    }, 3000);
                }
                return () => {
                    if (interval) clearInterval(interval);
                };
            }, [autoRefresh]);

            // Actualizar iconos Lucide tras cada render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            if (loading && !kpis) {
                return (
                    <div class="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                        <p class="mt-4 text-slate-600 font-semibold text-lg">Cargando datos desde SQL Server...</p>
                        <p class="text-sm text-slate-400">INBESTIGA_TESIS · Fase BUYER</p>
                    </div>
                );
            }

            return (
                <div class="min-h-screen flex flex-col bg-slate-50">
                    {/* Header Ejecutivo */}
                    <Header 
                        lastUpdated={lastUpdated} 
                        autoRefresh={autoRefresh} 
                        setAutoRefresh={setAutoRefresh}
                        onRefresh={() => fetchData(true)}
                        isRefreshing={isRefreshing}
                        totalBuyers={kpis?.total_buyers || 0}
                    />

                    {/* Navegación por Pestañas */}
                    <div class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <nav class="flex space-x-1 sm:space-x-8">
                                <button
                                    onClick={() => setActiveTab('resumen')}
                                    class={`py-4 px-3 border-b-2 font-medium text-sm sm:text-base flex items-center space-x-2 transition-colors ${
                                        activeTab === 'resumen'
                                            ? 'border-indigo-600 text-indigo-600'
                                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                    }`}
                                >
                                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                    <span>Resumen & KPIs</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('trazabilidad')}
                                    class={`py-4 px-3 border-b-2 font-medium text-sm sm:text-base flex items-center space-x-2 transition-colors ${
                                        activeTab === 'trazabilidad'
                                            ? 'border-indigo-600 text-indigo-600'
                                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                    }`}
                                >
                                    <i data-lucide="users" class="w-5 h-5"></i>
                                    <span>Trazabilidad de Buyers</span>
                                    <span class="ml-2 bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full text-xs font-bold">
                                        {buyers.length}
                                    </span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('chats')}
                                    class={`py-4 px-3 border-b-2 font-medium text-sm sm:text-base flex items-center space-x-2 transition-colors ${
                                        activeTab === 'chats'
                                            ? 'border-indigo-600 text-indigo-600'
                                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                    }`}
                                >
                                    <i data-lucide="message-square" class="w-5 h-5"></i>
                                    <span>Auditoría de WhatsApp</span>
                                </button>
                            </nav>

                            <div class="hidden sm:flex items-center space-x-3 text-xs text-slate-500">
                                <span class="flex items-center">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1.5 pulse-dot"></span>
                                    SQL Server Conectado
                                </span>
                                <span>•</span>
                                <span>Frecuencia: <strong>3s</strong></span>
                            </div>
                        </div>
                    </div>

                    {/* Contenido Dinámico de Pestañas */}
                    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {activeTab === 'resumen' && (
                            <TabResumen 
                                kpis={kpis} 
                                buyers={buyers} 
                                onGoToTrazabilidad={() => setActiveTab('trazabilidad')}
                            />
                        )}

                        {activeTab === 'trazabilidad' && (
                            <TabTrazabilidad 
                                buyers={buyers} 
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                filterStatus={filterStatus}
                                setFilterStatus={setFilterStatus}
                                onOpenChat={(phone) => {
                                    setSelectedPhone(phone);
                                    setActiveTab('chats');
                                }}
                            />
                        )}

                        {activeTab === 'chats' && (
                            <TabAuditoriaChats 
                                conversaciones={conversaciones} 
                                buyers={buyers}
                                selectedPhone={selectedPhone}
                                setSelectedPhone={setSelectedPhone}
                            />
                        )}
                    </main>

                    {/* Footer */}
                    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
                        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div>
                                🎓 <strong>Universidad Nacional de Trujillo</strong> · Escuela de Ingeniería de Sistemas · Inteligencia de Negocios (Ciclo VIII)
                            </div>
                            <div class="font-medium text-slate-600">
                                Prototipo Funcional de Captación · INBESTIGA (Fase BUYER)
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════
        // COMPONENTES AUXILIARES: Header
        // ══════════════════════════════════════════════════════════════════════
        function Header({ lastUpdated, autoRefresh, setAutoRefresh, onRefresh, isRefreshing, totalBuyers }) {
            return (
                <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-lg">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center shadow-inner font-black text-2xl text-white">
                                🎓
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">INBESTIGA BI</h1>
                                    <span class="bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 px-2 py-0.5 rounded text-xs font-semibold tracking-wide uppercase">
                                        Fase BUYER
                                    </span>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-300">
                                    Panel de Inteligencia de Negocios & Monitoreo del Agente IA ("Vicky")
                                </p>
                            </div>
                        </div>

                        {/* Controles de Sincronización */}
                        <div class="flex items-center space-x-3 self-end md:self-auto bg-slate-800/80 backdrop-blur p-2 rounded-xl border border-slate-700">
                            <div class="flex items-center space-x-2 px-2">
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        checked={autoRefresh} 
                                        onChange={(e) => setAutoRefresh(e.target.checked)}
                                        class="sr-only peer"
                                    />
                                    <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                                </label>
                                <span class="text-xs text-slate-300 font-medium">Auto-refresco (3s)</span>
                            </div>

                            <div class="h-5 w-px bg-slate-700"></div>

                            <button 
                                onClick={onRefresh}
                                class="flex items-center space-x-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold rounded-lg shadow transition"
                                title="Refrescar datos ahora"
                            >
                                <i data-lucide="refresh-cw" class={`w-3.5 h-3.5 ${isRefreshing ? 'animate-spin' : ''}`}></i>
                                <span>Refrescar</span>
                            </button>

                            <div class="text-right pl-2 hidden sm:block">
                                <div class="text-[10px] text-slate-400">Última lectura</div>
                                <div class="text-xs font-mono font-bold text-emerald-400">{lastUpdated || '--:--:--'}</div>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        // ══════════════════════════════════════════════════════════════════════
        // PESTAÑA 1: RESUMEN EJECUTIVO & KPIS
        // ══════════════════════════════════════════════════════════════════════
        function TabResumen({ kpis, buyers, onGoToTrazabilidad }) {
            return (
                <div class="space-y-6">
                    {/* Tarjetas de KPIs Oficiales B01, B02, B06, B07 */}
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        {/* KPI B01 */}
                        <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-emerald-500 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[11px] font-bold text-emerald-600 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded">
                                        KPI B01 · Oficial
                                    </span>
                                    <h3 class="text-sm font-semibold text-slate-600 mt-2">Tasa Conversión a LEAD</h3>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                                    <i data-lucide="user-check" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <div class="mt-4 flex items-baseline space-x-2">
                                <span class="text-3xl font-extrabold text-slate-900">{kpis?.b01}%</span>
                                <span class="text-xs text-slate-500 font-medium">efectividad</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-3 overflow-hidden">
                                <div class="bg-emerald-500 h-2 rounded-full" style={{ width: `${Math.min(kpis?.b01 || 0, 100)}%` }}></div>
                            </div>
                            <p class="text-xs text-slate-500 mt-3 flex justify-between">
                                <span>{kpis?.total_leads} leads generados</span>
                                <span class="font-medium text-slate-700">de {kpis?.total_buyers} buyers</span>
                            </p>
                        </div>

                        {/* KPI B02 */}
                        <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-blue-500 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[11px] font-bold text-blue-600 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded">
                                        KPI B02 · Oficial
                                    </span>
                                    <h3 class="text-sm font-semibold text-slate-600 mt-2">Tasa Interacción de Valor</h3>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
                                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <div class="mt-4 flex items-baseline space-x-2">
                                <span class="text-3xl font-extrabold text-slate-900">{kpis?.b02}%</span>
                                <span class="text-xs text-slate-500 font-medium">relevancia</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-3 overflow-hidden">
                                <div class="bg-blue-500 h-2 rounded-full" style={{ width: `${Math.min(kpis?.b02 || 0, 100)}%` }}></div>
                            </div>
                            <p class="text-xs text-slate-500 mt-3 flex justify-between">
                                <span>{kpis?.interacciones_valor} interacciones clave</span>
                                <span class="font-medium text-slate-700">en WhatsApp</span>
                            </p>
                        </div>

                        {/* KPI B06 */}
                        <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-rose-500 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[11px] font-bold text-rose-600 uppercase tracking-wider bg-rose-50 px-2 py-0.5 rounded">
                                        KPI B06 · Demanda
                                    </span>
                                    <h3 class="text-sm font-semibold text-slate-600 mt-2">Fuera de Cobertura</h3>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center">
                                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <div class="mt-4 flex items-baseline space-x-2">
                                <span class="text-3xl font-extrabold text-rose-600">{kpis?.b06}</span>
                                <span class="text-xs text-slate-500 font-medium">en lista de espera</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-3 overflow-hidden">
                                <div class="bg-rose-500 h-2 rounded-full" style={{ width: `${Math.min((kpis?.b06 / (kpis?.total_buyers || 1)) * 100, 100)}%` }}></div>
                            </div>
                            <p class="text-xs text-slate-500 mt-3">
                                💡 <span class="font-semibold text-rose-700">Oportunidad:</span> carreras para aperturar
                            </p>
                        </div>

                        {/* KPI B07 */}
                        <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-indigo-500 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[11px] font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2 py-0.5 rounded">
                                        KPI B07 · CAC
                                    </span>
                                    <h3 class="text-sm font-semibold text-slate-600 mt-2">Costo por Buyer</h3>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center">
                                    <i data-lucide="coins" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <div class="mt-4 flex items-baseline space-x-2">
                                <span class="text-3xl font-extrabold text-slate-900">S/ {kpis?.b07}</span>
                                <span class="text-xs text-slate-500 font-medium">unitario</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-3 overflow-hidden">
                                <div class="bg-indigo-500 h-2 rounded-full w-3/4"></div>
                            </div>
                            <p class="text-xs text-slate-500 mt-3 flex justify-between">
                                <span>Inversión total:</span>
                                <span class="font-bold text-slate-800">S/ {kpis?.total_inversion?.toLocaleString()}</span>
                            </p>
                        </div>
                    </div>

                    {/* Gráficos Analíticos */}
                    <ChartsSection buyers={buyers} kpis={kpis} />

                    {/* Últimos Buyers en Tiempo Real */}
                    <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <i data-lucide="clock" class="w-5 h-5 text-indigo-600"></i>
                                    <span>Últimos Prospectos Captados por WhatsApp</span>
                                </h3>
                                <p class="text-xs text-slate-500">Reflejo directo de la tabla transaccional BUYER ordenada por ID descendente</p>
                            </div>
                            <button 
                                onClick={onGoToTrazabilidad}
                                class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition"
                            >
                                <span>Ver lista completa ({buyers.length})</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs sm:text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold">
                                        <th class="py-3 px-3">ID</th>
                                        <th class="py-3 px-3">Estudiante</th>
                                        <th class="py-3 px-3">WhatsApp</th>
                                        <th class="py-3 px-3">Universidad & Carrera</th>
                                        <th class="py-3 px-3">Estado</th>
                                        <th class="py-3 px-3">Fecha Captación</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    {buyers.slice(0, 6).map((b) => (
                                        <tr key={b.buyer_id} class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-3 font-mono text-slate-500 font-semibold">#{b.buyer_id}</td>
                                            <td class="py-3 px-3">
                                                <div class="font-semibold text-slate-800">{b.nombre_completo || 'Estudiante WhatsApp'}</div>
                                                <div class="text-[11px] text-slate-400">{b.correo || 'Sin correo'}</div>
                                            </td>
                                            <td class="py-3 px-3 font-mono text-slate-600 font-medium">
                                                +{b.whatsapp}
                                            </td>
                                            <td class="py-3 px-3">
                                                <div class="font-medium text-slate-800">{b.carrera || 'No especificada'}</div>
                                                <div class="text-[11px] text-slate-500">{b.universidad || 'Universidad de origen'}</div>
                                            </td>
                                            <td class="py-3 px-3">
                                                {b.estado_buyer === 'ACTIVO' ? (
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
                                                        ACTIVO (Con Cobertura)
                                                    </span>
                                                ) : (
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">
                                                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>
                                                        SIN_COBERTURA (Espera)
                                                    </span>
                                                )}
                                            </td>
                                            <td class="py-3 px-3 text-slate-500 text-xs font-mono">
                                                {new Date(b.fecha_buyer).toLocaleString()}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════
        // GRÁFICOS: ChartsSection (Chart.js)
        // ══════════════════════════════════════════════════════════════════════
        function ChartsSection({ buyers, kpis }) {
            const barChartRef = useRef(null);
            const donutChartRef = useRef(null);

            useEffect(() => {
                if (!buyers || buyers.length === 0) return;

                // 1. Preparar datos para Gráfico de Barras: Buyers por Universidad y Estado
                const uniMap = {};
                buyers.forEach(b => {
                    const uni = b.universidad || 'Otra';
                    if (!uniMap[uni]) uniMap[uni] = { activo: 0, sin: 0 };
                    if (b.estado_buyer === 'ACTIVO') uniMap[uni].activo++;
                    else uniMap[uni].sin++;
                });

                const labels = Object.keys(uniMap);
                const dataActivo = labels.map(u => uniMap[u].activo);
                const dataSin = labels.map(u => uniMap[u].sin);

                // Destruir instancias previas
                if (barChartRef.current && barChartRef.current._chartInstance) {
                    barChartRef.current._chartInstance.destroy();
                }
                if (donutChartRef.current && donutChartRef.current._chartInstance) {
                    donutChartRef.current._chartInstance.destroy();
                }

                // Render Gráfico de Barras
                if (barChartRef.current) {
                    const ctx = barChartRef.current.getContext('2d');
                    barChartRef.current._chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Con Cobertura (ACTIVO)',
                                    data: dataActivo,
                                    backgroundColor: '#10b981',
                                    borderRadius: 6
                                },
                                {
                                    label: 'Sin Cobertura (LISTA ESPERA)',
                                    data: dataSin,
                                    backgroundColor: '#ef4444',
                                    borderRadius: 6
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } },
                                tooltip: { padding: 10, cornerRadius: 8 }
                            },
                            scales: {
                                x: { stacked: true, grid: { display: false } },
                                y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' } }
                            }
                        }
                    });
                }

                // Render Gráfico de Dona: Proporción
                if (donutChartRef.current) {
                    const ctxDonut = donutChartRef.current.getContext('2d');
                    const activosCount = buyers.filter(b => b.estado_buyer === 'ACTIVO').length;
                    const sinCount = buyers.filter(b => b.estado_buyer === 'SIN_COBERTURA').length;

                    donutChartRef.current._chartInstance = new Chart(ctxDonut, {
                        type: 'doughnut',
                        data: {
                            labels: ['Con Cobertura (ACTIVO)', 'Sin Cobertura (ESPERA)'],
                            datasets: [{
                                data: [activosCount, sinCount],
                                backgroundColor: ['#10b981', '#ef4444'],
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '70%',
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } },
                                tooltip: { padding: 10, cornerRadius: 8 }
                            }
                        }
                    });
                }
            }, [buyers]);

            return (
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Gráfico 1: Barras */}
                    <div class="lg:col-span-2 glass-card rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="text-base font-bold text-slate-900">Demanda por Universidad</h3>
                                <p class="text-xs text-slate-500">Volumen comparativo de cobertura activa vs demanda insatisfecha</p>
                            </div>
                        </div>
                        <div class="h-64 sm:h-72 w-full relative">
                            <canvas ref={barChartRef}></canvas>
                        </div>
                    </div>

                    {/* Gráfico 2: Dona */}
                    <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col">
                        <div class="mb-4">
                            <h3 class="text-base font-bold text-slate-900">Efectividad de Catálogo</h3>
                            <p class="text-xs text-slate-500">Proporción general de atención</p>
                        </div>
                        <div class="h-60 w-full relative flex-1">
                            <canvas ref={donutChartRef}></canvas>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-around text-center text-xs">
                            <div>
                                <span class="text-slate-400 block">Tasa Cobertura</span>
                                <span class="font-bold text-emerald-600 text-sm">{kpis?.tasa_cobertura || 0}%</span>
                            </div>
                            <div class="w-px h-8 bg-slate-200"></div>
                            <div>
                                <span class="text-slate-400 block">Tasa Descarte</span>
                                <span class="font-bold text-rose-600 text-sm">{(100 - (kpis?.tasa_cobertura || 0)).toFixed(1)}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════
        // PESTAÑA 2: TRAZABILIDAD DE BUYERS (Tabla Interactiva)
        // ══════════════════════════════════════════════════════════════════════
        function TabTrazabilidad({ buyers, searchTerm, setSearchTerm, filterStatus, setFilterStatus, onOpenChat }) {
            const filteredBuyers = useMemo(() => {
                return buyers.filter(b => {
                    const matchesSearch = 
                        (b.nombre_completo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (b.universidad || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (b.carrera || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (b.whatsapp || '').includes(searchTerm);

                    const matchesFilter = 
                        filterStatus === 'ALL' ? true : b.estado_buyer === filterStatus;

                    return matchesSearch && matchesFilter;
                });
            }, [buyers, searchTerm, filterStatus]);

            return (
                <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                    {/* Filtros y Buscador */}
                    <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
                        <div>
                            <h2 class="text-lg font-bold text-slate-900">Trazabilidad de Prospectos (Fase BUYER)</h2>
                            <p class="text-xs text-slate-500">Mostrando {filteredBuyers.length} de {buyers.length} registros totales en SQL Server</p>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3">
                            {/* Buscador */}
                            <div class="relative">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                                <input
                                    type="text"
                                    placeholder="Buscar por nombre, carrera o uni..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    class="pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-64"
                                />
                            </div>

                            {/* Filtro de Estado */}
                            <div class="flex rounded-xl bg-slate-100 p-1 border border-slate-200 text-xs font-semibold">
                                <button
                                    onClick={() => setFilterStatus('ALL')}
                                    class={`px-3 py-1.5 rounded-lg transition ${filterStatus === 'ALL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    Todos
                                </button>
                                <button
                                    onClick={() => setFilterStatus('ACTIVO')}
                                    class={`px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${filterStatus === 'ACTIVO' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <span>Activos</span>
                                </button>
                                <button
                                    onClick={() => setFilterStatus('SIN_COBERTURA')}
                                    class={`px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${filterStatus === 'SIN_COBERTURA' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <span>Sin Cobertura</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Tabla */}
                    <div class="overflow-x-auto rounded-xl border border-slate-200">
                        <table class="w-full text-left text-xs sm:text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold">
                                <tr>
                                    <th class="py-3.5 px-4">ID</th>
                                    <th class="py-3.5 px-4">Fecha y Hora</th>
                                    <th class="py-3.5 px-4">Estudiante</th>
                                    <th class="py-3.5 px-4">WhatsApp</th>
                                    <th class="py-3.5 px-4">Universidad</th>
                                    <th class="py-3.5 px-4">Carrera</th>
                                    <th class="py-3.5 px-4">Estado</th>
                                    <th class="py-3.5 px-4 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 bg-white">
                                {filteredBuyers.length > 0 ? (
                                    filteredBuyers.map(b => (
                                        <tr key={b.buyer_id} class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-4 font-mono font-bold text-slate-700">#{b.buyer_id}</td>
                                            <td class="py-3 px-4 text-slate-500 font-mono text-xs">
                                                {new Date(b.fecha_buyer).toLocaleString()}
                                            </td>
                                            <td class="py-3 px-4">
                                                <div class="font-bold text-slate-900">{b.nombre_completo || 'Estudiante'}</div>
                                                <div class="text-[11px] text-slate-400">{b.etapa_academica || 'Pregrado'}</div>
                                            </td>
                                            <td class="py-3 px-4 font-mono font-medium text-slate-600">
                                                +{b.whatsapp}
                                            </td>
                                            <td class="py-3 px-4 font-medium text-slate-800">
                                                {b.universidad || 'No indicada'}
                                            </td>
                                            <td class="py-3 px-4 text-slate-700">
                                                {b.carrera || 'No indicada'}
                                            </td>
                                            <td class="py-3 px-4">
                                                {b.estado_buyer === 'ACTIVO' ? (
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
                                                        ACTIVO
                                                    </span>
                                                ) : (
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">
                                                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>
                                                        SIN_COBERTURA
                                                    </span>
                                                )}
                                            </td>
                                            <td class="py-3 px-4 text-center">
                                                <button
                                                    onClick={() => onOpenChat(b.whatsapp)}
                                                    class="inline-flex items-center space-x-1 px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-lg text-xs font-semibold transition"
                                                    title="Ver conversación de WhatsApp"
                                                >
                                                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                                                    <span>Chat</span>
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                ) : (
                                    <tr>
                                        <td colspan="8" class="text-center py-8 text-slate-400">
                                            No se encontraron buyers que coincidan con la búsqueda.
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════
        // PESTAÑA 3: AUDITORÍA DE WHATSAPP (Clon WhatsApp Web)
        // ══════════════════════════════════════════════════════════════════════
        function TabAuditoriaChats({ conversaciones, buyers, selectedPhone, setSelectedPhone }) {
            // Agrupar mensajes por número de WhatsApp y ordenar desde la última conversación hacia abajo
            const chatsPorTelefono = useMemo(() => {
                const map = {};
                conversaciones.forEach(m => {
                    const wa = m.whatsapp;
                    if (!map[wa]) {
                        map[wa] = {
                            whatsapp: wa,
                            nombre: m.nombre_completo,
                            mensajes: [],
                            ultimoTimestamp: 0,
                            ultimoMensajeId: 0
                        };
                    }
                    map[wa].mensajes.push(m);
                    const msgTime = new Date(m.fecha_mensaje).getTime() || 0;
                    if (msgTime >= map[wa].ultimoTimestamp) {
                        map[wa].ultimoTimestamp = msgTime;
                        map[wa].ultimoMensajeId = m.mensaje_id || 0;
                    }
                });
                // Ordenar: de la última conversación (más reciente) hacia abajo
                return Object.values(map).sort((a, b) => {
                    if (b.ultimoMensajeId !== a.ultimoMensajeId) {
                        return b.ultimoMensajeId - a.ultimoMensajeId;
                    }
                    return b.ultimoTimestamp - a.ultimoTimestamp;
                });
            }, [conversaciones]);

            // Seleccionar primer chat por defecto (el más reciente) si no hay ninguno seleccionado
            const activeChat = useMemo(() => {
                if (selectedPhone) {
                    return chatsPorTelefono.find(c => c.whatsapp === selectedPhone) || chatsPorTelefono[0];
                }
                return chatsPorTelefono[0] || null;
            }, [chatsPorTelefono, selectedPhone]);

            // Auto-scroll al último mensaje
            const messagesEndRef = useRef(null);
            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [activeChat, conversaciones]);

            // Obtener el estado del buyer seleccionado si existe
            const buyerRelacionado = useMemo(() => {
                if (!activeChat) return null;
                return buyers.find(b => b.whatsapp === activeChat.whatsapp);
            }, [activeChat, buyers]);

            return (
                <div class="glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row h-[680px]">
                    {/* Lista Izquierda de Contactos */}
                    <div class="w-full md:w-80 border-r border-slate-200 bg-white flex flex-col">
                        <div class="p-4 border-b border-slate-200 bg-slate-50">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i data-lucide="messages-square" class="w-4 h-4 text-indigo-600"></i>
                                <span>Conversaciones ({chatsPorTelefono.length})</span>
                            </h3>
                            <p class="text-[11px] text-slate-500">Historial auditado en la tabla MENSAJE</p>
                        </div>

                        <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
                            {chatsPorTelefono.map(chat => {
                                const isSelected = activeChat && activeChat.whatsapp === chat.whatsapp;
                                const ultimoMsg = chat.mensajes[chat.mensajes.length - 1];
                                return (
                                    <div
                                        key={chat.whatsapp}
                                        onClick={() => setSelectedPhone(chat.whatsapp)}
                                        class={`p-3.5 cursor-pointer transition flex items-start space-x-3 ${
                                            isSelected ? 'bg-indigo-50/80 border-l-4 border-indigo-600' : 'hover:bg-slate-50'
                                        }`}
                                    >
                                        <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm shrink-0">
                                            👤
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex justify-between items-baseline">
                                                <h4 class="text-xs font-bold text-slate-900 truncate">
                                                    {chat.nombre || 'Estudiante'}
                                                </h4>
                                                <span class="text-[10px] text-slate-400 font-mono">
                                                    {ultimoMsg ? new Date(ultimoMsg.fecha_mensaje).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                                                </span>
                                            </div>
                                            <p class="text-[11px] text-slate-500 font-mono">+{chat.whatsapp}</p>
                                            <p class="text-xs text-slate-600 truncate mt-1">
                                                {ultimoMsg ? (ultimoMsg.emisor === 'BOT' ? '🤖 Vicky: ' : '👤 ') + ultimoMsg.contenido : ''}
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Ventana Derecha de Chat estilo WhatsApp Web */}
                    <div class="flex-1 flex flex-col bg-[#efeae2] relative">
                        {activeChat ? (
                            <React.Fragment>
                                {/* Cabecera del Chat Activo */}
                                <div class="bg-white p-3.5 border-b border-slate-200 flex justify-between items-center z-10 shadow-sm">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-base">
                                            🎓
                                        </div>
                                        <div>
                                            <div class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                                <span>{activeChat.nombre || 'Estudiante'}</span>
                                                {buyerRelacionado && (
                                                    <span class={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                                        buyerRelacionado.estado_buyer === 'ACTIVO'
                                                            ? 'bg-emerald-100 text-emerald-800'
                                                            : 'bg-rose-100 text-rose-800'
                                                    }`}>
                                                        {buyerRelacionado.estado_buyer}
                                                    </span>
                                                )}
                                            </div>
                                            <div class="text-xs text-slate-500 font-mono">
                                                WhatsApp: +{activeChat.whatsapp} {buyerRelacionado ? `· ${buyerRelacionado.carrera || ''} (${buyerRelacionado.universidad || ''})` : ''}
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-2 text-xs text-emerald-700 font-semibold bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></span>
                                        <span>Auditoría en Vivo</span>
                                    </div>
                                </div>

                                {/* Mensajes estilo Burbujas de WhatsApp */}
                                <div class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
                                    {activeChat.mensajes.map((m, idx) => {
                                        const isBot = m.emisor === 'BOT';
                                        return (
                                            <div
                                                key={m.mensaje_id || idx}
                                                class={`flex ${isBot ? 'justify-end' : 'justify-start'}`}
                                            >
                                                <div
                                                    class={`max-w-[85%] sm:max-w-[70%] rounded-2xl px-4 py-2.5 shadow-sm text-sm relative ${
                                                        isBot 
                                                            ? 'bg-[#d9fdd3] text-slate-900 rounded-tr-none' 
                                                            : 'bg-white text-slate-900 rounded-tl-none border border-slate-200'
                                                    }`}
                                                >
                                                    <div class="text-[10px] font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5 opacity-75">
                                                        <span>{isBot ? '🤖 Vicky (Asistente IA)' : `👤 ${activeChat.nombre || 'Estudiante'}`}</span>
                                                    </div>
                                                    <p class="whitespace-pre-line leading-relaxed text-[13.5px]">
                                                        {m.contenido}
                                                    </p>
                                                    <div class="text-right mt-1 text-[10px] text-slate-500 font-mono flex items-center justify-end gap-1">
                                                        <span>{new Date(m.fecha_mensaje).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second: '2-digit'})}</span>
                                                        {isBot && <span class="text-sky-600 font-bold">✓✓</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <div ref={messagesEndRef}></div>
                                </div>

                                {/* Barra inferior informativa */}
                                <div class="bg-white p-3 border-t border-slate-200 text-center text-xs text-slate-400">
                                    🔒 Conversación encriptada e indexada en tiempo real en la tabla <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-slate-600">MENSAJE</code>.
                                </div>
                            </React.Fragment>
                        ) : (
                            <div class="flex-1 flex flex-col items-center justify-center text-slate-400">
                                <i data-lucide="message-square" class="w-12 h-12 mb-2 stroke-1"></i>
                                <p>Selecciona una conversación a la izquierda para ver el chat auditado.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Renderizar React en el DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
